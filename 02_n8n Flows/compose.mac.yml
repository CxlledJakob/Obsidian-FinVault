# Lokales n8n für FinVault (macOS / Apple Silicon, läuft aber auch unter Windows/Linux)
# Start:   docker compose -f compose.mac.yml up -d
# Stopp:   docker compose -f compose.mac.yml down
#
# Alle Pfade sind relativ zum Repo – keine rechnerspezifischen Pfade nötig.
# Im Container gilt immer derselbe Pfad wie im Architekturkonzept: /vault/Finanzen/Trading

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.10   # gepinnt, gleiche Version wie bei Kuba
    container_name: n8n-finvault
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      TZ: "Europe/Berlin"
      GENERIC_TIMEZONE: "Europe/Berlin"
      N8N_RESTRICT_FILE_ACCESS_TO: "/vault/Finanzen/Trading"
      N8N_SECURE_COOKIE: "false"            # nur lokal über http://localhost
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n                         # n8n-interne Daten inkl. Credentials (nicht im Git)
      - ../01_Dateiarchitektur_Finanzen:/vault/Finanzen  # Vault aus dem Repo
      - ./workflows:/home/node/workflows                 # Workflow-Exporte fürs Git
      - ./scripts:/home/node/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"              # optional: Dienste auf dem Host (z. B. Ollama) unter http://host.docker.internal

volumes:
  n8n_data:
    name: n8n_finvault_data
