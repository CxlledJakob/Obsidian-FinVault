services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    image: n8n-media-local:2.37.10
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      NODES_EXCLUDE: "[]"
      N8N_RESTRICT_FILE_ACCESS_TO: "/vault:/finvault"
      TZ: "Europe/Berlin"
      GENERIC_TIMEZONE: "Europe/Berlin"
      SHELL: "/bin/sh"
    volumes:
      - n8n_data:/home/node/.n8n
      - "C:/Users/Kuba/Desktop/Obsidian_Desktop/Obsidian-FinVault:/finvault"
      - "C:/Users/Kuba/Desktop/Obsidian_Desktop/Obsidian-FinVault/01_Dateiarchitektur_Finanzen:/vault/01_Dateiarchitektur_Finanzen"
      - "C:/Users/Kuba/n8n-media:/opt/media-pipeline"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
    external: true
    name: n8n_data
